name: Render Zakrutitsya — рилс «Мотор включён. Закрутится?» (SPIKE Prime, три шестерни в углу)

# Запуск вручную: Actions → Render Zakrutitsya → Run workflow.
# Камера в ролике одна, модель меняет положение только в 58 «состояниях» (timeline_z.states / state_at):
# Blender рендерит каждое состояние один раз во весь кадр 1080×1920, наезд, дрожь, стрелки, подписи и логотип
# дорисовывает scenes/zakrutitsya/overlay_z.py. Звук — audio_z.py. Результат — ветка renders-zakrutitsya (video/).
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Сэмплы Cycles (с шумодавом)"
        default: "40"

permissions:
  contents: write
  actions: read

concurrency:
  group: zakrutitsya
  cancel-in-progress: true

env:
  SCENE: scenes/zakrutitsya
  CHUNKS: "6"
  WIDTH: "1080"
  HEIGHT: "1920"

jobs:
  render:
    name: states ${{ matrix.chunk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    env:
      LDRAW_DIR: ${{ github.workspace }}/lib/ldraw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: System libraries for headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 > /dev/null
      - name: LDraw library (official + unofficial + repo parts)
        run: |
          mkdir -p lib && cd lib
          curl -sSfL -o complete.zip https://library.ldraw.org/library/updates/complete.zip
          unzip -q complete.zip
          if curl -sSfL -o unf.zip https://library.ldraw.org/library/unofficial/ldrawunf.zip; then unzip -q -n unf.zip -d ldraw; fi
          cp -r ../ldraw/* ldraw/
      - name: Python packages
        run: pip install -q bpy==5.2.2 pillow numpy
      - name: Render states
        run: |
          cd "$SCENE"
          NAMES=$(python -c "
          import timeline_z as T
          used = sorted({T.state_at(i / T.FPS) for i in range(T.FRAMES)})
          k, n = ${{ matrix.chunk }}, int('$CHUNKS')
          print(','.join(used[k::n]))")
          echo "states: $NAMES"
          python scene_z.py states st "$WIDTH" "$HEIGHT" "${{ inputs.samples }}" "$NAMES" 2>&1 | grep -E "Saved|Traceback| File|Error|MISSING" || true
          test "$(ls st/*.png | wc -l)" -eq "$(echo "$NAMES" | tr ',' '\n' | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: zakrutitsya-${{ matrix.chunk }}
          path: ${{ env.SCENE }}/st/*.png
          retention-days: 2

  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@v4
        with:
          pattern: zakrutitsya-*
          merge-multiple: true
          path: ${{ env.SCENE }}/st
      - name: Compose, sound and encode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter > /dev/null
          pip install -q pillow numpy
          cd "$SCENE"
          ls st | wc -l
          python overlay_z.py reel st o
          python audio_z.py sound.wav
          mkdir -p "$GITHUB_WORKSPACE/pub/video"
          ffmpeg -loglevel error -framerate 30 -i o/o%04d.png -i sound.wav \
            -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -profile:v high -level 4.1 -movflags +faststart \
            -af loudnorm=I=-14:TP=-1.5:LRA=11 -c:a aac -b:a 192k -shortest "$GITHUB_WORKSPACE/pub/video/zakrutitsya_reel.mp4"
          python -c "from PIL import Image; Image.open('o/o0000.png').convert('RGB').save('$GITHUB_WORKSPACE/pub/video/zakrutitsya_cover.jpg', quality=92)"
          ls -la "$GITHUB_WORKSPACE/pub/video"
      - name: Push renders-zakrutitsya
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pub && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b renders-zakrutitsya && git add -A && git commit -qm "zakrutitsya video (run $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" renders-zakrutitsya
