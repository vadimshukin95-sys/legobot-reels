name: Still — двери супермаркета (пост)

# Стоп-кадр для поста: запускается пушем в ветку scene-dveri или вручную (Actions → Run workflow).
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Сэмплы Cycles"
        default: "200"
        required: true
  push:
    branches: [scene-dveri]
    paths:
      - "scenes/dveri/**"
      - ".github/workflows/still-dveri.yml"

permissions:
  contents: read

concurrency:
  group: still-dveri
  cancel-in-progress: true

jobs:
  still:
    name: still ${{ matrix.size }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        size: ["1080x1080", "1080x1350"]
    env:
      LDRAW_DIR: ${{ github.workspace }}/ldraw
      SAMPLES: ${{ inputs.samples || '64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 > /dev/null

      - name: Python packages
        run: pip install -q bpy==5.2.2 pillow

      - name: Render still
        run: |
          S=${{ matrix.size }}; W=${S%x*}; H=${S#*x}
          python scenes/dveri/still.py "$W" "$H" "$SAMPLES" "out/dveri_${S}.png" 70
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dveri-still-${{ matrix.size }}
          path: out/*.png
          retention-days: 14
